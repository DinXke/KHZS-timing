# HZS Timing: het opstartscherm blijft staan tot de server antwoordt (max. 60 s), toont "Klaar" en laat dan
# het laatste beeld staan tot het HDMI-scherm (cage + Chromium) het overneemt – geen zwart scherm of tekstconsole.
[Unit]
After=khzs-agent.service khzs-timing.service NetworkManager.service

[Service]
ExecStartPre=-/usr/bin/python3 /opt/khzs/agent/wait_server.py
ExecStartPre=-/usr/bin/plymouth update --status=khzs-klaar
ExecStartPre=-/bin/sleep 1.5
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
TimeoutStartSec=150
