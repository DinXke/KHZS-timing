[main]
plugins=keyfile

[device]
wifi.scan-rand-mac-address=no

[connection]
# energiebesparing van de Wi-Fi-chip uit: stabielere verbinding
wifi.powersave=2

[connectivity]
# internetcontrole per verbinding: zonder internet zakt die verbinding in de routevoorkeur,
# zodat het verkeer automatisch via een verbinding mét internet gaat (bv. 4G via USB)
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
interval=60
