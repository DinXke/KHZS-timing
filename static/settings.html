<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Beheer – KHZS Timing</title>
<script>try{var t=localStorage.getItem('lt_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{color-scheme:dark;--bg:#07131f;--bg2:#0a1928;--card:#0e2233;--card2:#12293d;--border:#23445e;--text:#e8f1f8;--muted:#9bb2c4;
--accent:#38bdf8;--accent2:#0ea5e9;--onacc:#06121c;--ok:#34d399;--warn:#fbbf24;--bad:#ff5d5d;--amber:#ffa726;--shadow:0 6px 24px rgba(0,0,0,.25);--r:14px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#eef3f7;--bg2:#e4ecf2;--card:#fff;--card2:#f4f8fb;--border:#c9d7e2;--text:#0b1f30;--muted:#51697d;--accent:#0369a1;--accent2:#0284c7;--onacc:#fff;--ok:#047857;--warn:#a16207;--bad:#c81e1e;--amber:#b45309;--shadow:0 4px 18px rgba(15,40,60,.08)}}
:root[data-theme="light"]{color-scheme:light;--bg:#eef3f7;--bg2:#e4ecf2;--card:#fff;--card2:#f4f8fb;--border:#c9d7e2;--text:#0b1f30;--muted:#51697d;--accent:#0369a1;--accent2:#0284c7;--onacc:#fff;--ok:#047857;--warn:#a16207;--bad:#c81e1e;--amber:#b45309;--shadow:0 4px 18px rgba(15,40,60,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
/* ---- kop */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{font-weight:800;font-size:17px;white-space:nowrap}.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--border);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.btn.pri:hover{background:var(--accent2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--border))}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.icon-btn{background:none;border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--text)}
/* ---- indeling */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav{background:var(--bg2);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav h4{margin:14px 10px 6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;margin:1px 0}
nav a:hover{background:var(--card2)}
nav a.on{background:var(--card);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
nav a .ic{width:22px;text-align:center;opacity:.9}
nav a .badge{margin-left:auto;background:var(--amber);color:#111;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px}
main{padding:22px clamp(14px,3vw,36px) 120px;max-width:1100px;width:100%}
.page{display:none}.page.on{display:block}
body.wide main{max-width:none}
.simframe{padding:0;overflow:hidden}.simframe iframe{display:block;width:100%;height:min(860px,calc(100vh - 120px));min-height:520px;border:0;background:#e6ebf1}
.page>h1{margin:0 0 4px;font-size:24px}.page>.lead{margin:0 0 18px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.card>.desc{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .v{font-size:19px;font-weight:700;margin-top:4px;word-break:break-word}
.stat .s{color:var(--muted);font-size:13px;margin-top:2px}
/* ---- velden */
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:6px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.f:first-of-type{border-top:0}
.f .lbl{font-weight:600}.f .help{color:var(--muted);font-size:13px;margin-top:2px;font-weight:400}
.f .ctl{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.f.wide{grid-template-columns:1fr}.f.wide .ctl{justify-content:flex-start}
.f.dirty .lbl::after{content:" •";color:var(--amber)}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--card2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=number]{max-width:140px;text-align:right}
.unit{color:var(--muted);font-size:13px;white-space:nowrap}
.sw{position:relative;display:inline-block;vertical-align:middle;width:46px;height:26px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span::before{transform:translateX(20px)}
.sw input:disabled+span{opacity:.5;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--onacc)}
.seg button:disabled{opacity:.5;cursor:default}
.pwrap{position:relative;width:100%}.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted)}
/* ---- meldingen */
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin:0 0 14px;border:1px solid}
.banner b{font-weight:700}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}
.banner.info{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:color-mix(in srgb,var(--bad) 50%,var(--border))}
.banner .sp{flex:1;min-width:200px}
.savebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);transition:transform .25s;z-index:40;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:10px 12px 10px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.savebar.on{transform:translateX(-50%) translateY(0)}
.toast{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast div{padding:10px 14px;border-radius:11px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);animation:tin .25s}
.toast .ok{border-left:4px solid var(--ok)}.toast .err{border-left:4px solid var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* ---- netwerk */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:6px 0 4px}
@media (max-width:1180px){.flow{grid-template-columns:minmax(0,1fr)}.flow .arrow{transform:rotate(90deg);justify-self:center}}
.node{min-width:0;overflow-wrap:anywhere}main{min-width:0}
.node{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.node .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
.node .row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:14px}
.node .row .m{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.node.pi{border-color:var(--accent);text-align:center;display:flex;flex-direction:column;justify-content:center}
.node.pi .name{font-weight:800;font-size:16px}
.arrow{align-self:center;color:var(--muted);font-size:22px}
.iface{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--card2)}
.iface h3{margin:0 0 2px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.iface .st{color:var(--muted);font-size:13px;margin-bottom:10px}
.sub-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;margin-top:12px}
.sub-f label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
table.list{width:100%;border-collapse:collapse}
table.list td,table.list th{padding:9px 8px;border-top:1px solid var(--border);text-align:left;vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.bars i{width:4px;background:var(--border);border-radius:1px}.bars i.on{background:var(--accent)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.log{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;max-height:260px;overflow:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--text)}
.portal{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;max-width:1024px}
.portal img{display:block;width:100%;cursor:crosshair}
.portal .ph{padding:60px 20px;text-align:center;color:#555}
.urlbar{display:flex;gap:8px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal h3{margin:0 0 10px}.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.lock{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.lock.on{display:flex}
.lock .box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.lock .box h2{margin:0 0 6px}.lock .box p{color:var(--muted);margin:0 0 16px}
.role{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.role button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card2);cursor:pointer}
.role button b{display:block;font-size:16px;margin-bottom:4px}.role button span{color:var(--muted);font-size:13px}
.role button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card2))}
.hide{display:none!important}
.mobnav{display:none}
@media (max-width:560px){.top{gap:8px;padding:8px 10px}.pill>span:last-child{display:none}.pill{padding:7px}.icon-btn{padding:5px 8px}}
@media (max-width:860px){
 .layout{grid-template-columns:1fr}
 .layout{align-content:start}
 nav{position:static;height:auto;display:flex;align-items:center;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--border)}
 nav h4{display:none}nav a{flex:0 0 auto;padding:7px 11px}nav a .badge{margin-left:4px}
 .f{grid-template-columns:1fr}.f .ctl{justify-content:flex-start}
 .f.bool{grid-template-columns:minmax(0,1fr) auto}.f.bool .ctl{justify-content:flex-end}
 .flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}
 .top .sub{display:none}
}
@media (max-width:760px){#wSaved table,#wSaved tbody{display:block}#wSaved tr:first-child{display:none}
#wSaved tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card2)}
#wSaved td{display:block;border:0;padding:0}#wSaved td:nth-child(1){grid-row:1/span 4;display:flex;flex-direction:column;gap:4px}
#wSaved td:nth-child(2){grid-column:2}#wSaved td:nth-child(3),#wSaved td:nth-child(4),#wSaved td:nth-child(5){grid-column:2;font-size:13px}
#wSaved td:nth-child(5)::before{content:"laatst: "}#wSaved td:nth-child(6){grid-column:3;grid-row:1}#wSaved td:nth-child(7){grid-column:2/span 2;text-align:left!important;margin-top:6px}}
.term{background:#04090f;border:1px solid var(--border);border-radius:10px;padding:6px;height:min(460px,60vh);margin-top:12px}
.term.hide{display:none}
pre.logs{background:#04090f;color:#cfe3f3;border:1px solid var(--border);border-radius:10px;padding:10px;max-height:420px;overflow:auto;font:12px/1.4 Consolas,monospace;white-space:pre-wrap;margin:12px 0 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kv div{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font:inherit}
.modes button b{font-size:15px}.modes button span{font-size:12.5px;color:var(--muted)}.modes button i{font-style:normal;font-size:22px}
.modes button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.ipv{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#07131f}
.ipv iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0}
.ifl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ifl label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
.ifl input,.ifl textarea,.ifl select{width:100%;box-sizing:border-box}
</style>
<link rel="stylesheet" href="/vendor/xterm.css">
</head>
<body>
<div class="top">
  <div class="brand">KHZS <span>Timing</span></div>
  <div class="sub" id="topSub">Beheer</div>
  <div class="sp"></div>
  <span class="pill" id="pLive" title="Live timing"><span class="dot"></span><span>…</span></span>
  <span class="pill hide" id="pNet" title="Internet"><span class="dot"></span><span>…</span></span>
  <button class="icon-btn" id="themeBtn" title="Thema wisselen">◐</button>
  <button class="icon-btn" id="lockBtn" title="Afmelden">🔒</button>
</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar"><span id="saveTxt">Wijzigingen</span><button class="btn" id="saveCancel">Annuleren</button><button class="btn pri" id="saveBtn">Opslaan</button></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="acts" id="mActs"></div></div></div>
<div class="lock" id="lock"><div class="box"><h2>🔒 Beheerderscode</h2><p>Voer de beheerderscode in om instellingen te bekijken en te wijzigen.</p>
  <form id="lockForm"><input type="password" id="lockInput" placeholder="Beheerderscode" autocomplete="current-password" style="text-align:center;font-size:17px">
  <div style="margin-top:12px"><button class="btn pri" style="width:100%">Ontgrendelen</button></div></form>
  <p style="margin:14px 0 0;font-size:12.5px">Vergeten? Pas <span class="mono">beheerderscode</span> aan in <span class="mono">khzs-instellingen.txt</span> op de SD-kaart.</p></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token='';try{token=sessionStorage.getItem('lt_admin')||''}catch(e){}
let twoSrv=null,relayMode=false,relayAdmin=false,relayInfo={},defTok=false,cur={},defs={},canEdit=false,sys=null,sysLocked=false,dirty={},stateNow=null,users=null,scan=null;

/* ---------------------------------------------------------------- thema */
let tcur='auto';try{tcur=localStorage.getItem('lt_theme')||'auto'}catch(e){}
function themeApply(){const h=document.documentElement;if(tcur==='light'||tcur==='dark')h.setAttribute('data-theme',tcur);else h.removeAttribute('data-theme');
  $('themeBtn').textContent=tcur==='light'?'☀':(tcur==='dark'?'☾':'◐');$('themeBtn').title='Thema: '+({light:'licht',dark:'donker',auto:'automatisch'}[tcur])}
$('themeBtn').onclick=()=>{tcur={auto:'light',light:'dark',dark:'auto'}[tcur]||'auto';try{localStorage.setItem('lt_theme',tcur)}catch(e){}themeApply()};themeApply();

/* ---------------------------------------------------------------- hulpfuncties */
function toast(msg,kind){const d=document.createElement('div');d.className=kind||'ok';d.textContent=msg;$('toast').appendChild(d);setTimeout(()=>d.remove(),kind==='err'?7000:3500)}
function hdr(extra){const h=Object.assign({},extra||{});if(token)h['X-Admin-Token']=token;return h}
async function api(path,opts){
  opts=opts||{};const o={method:opts.method||'GET',headers:hdr(opts.headers)};
  if(opts.json!==undefined){o.method=opts.method||'POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(opts.json)}
  if(opts.body){o.method='POST';o.body=opts.body}
  const r=await fetch(path,o);let d=null;
  if(opts.raw)return r;
  try{d=await r.json()}catch(e){d={}}
  if(r.status===403){showLock();throw new Error(d.error||'beheerderscode nodig')}
  if(!r.ok||d.ok===false||d.error)throw new Error(d.error||(d.errors||[]).join(', ')||('fout '+r.status));
  return d;
}
async function act(btn,fn,okMsg){if(btn)btn.disabled=true;try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){toast(e.message,'err')}finally{if(btn)btn.disabled=false}}
function modal(title,body,acts){$('mTitle').textContent=title;$('mBody').innerHTML=body;$('mActs').innerHTML='';
  (acts||[{t:'Sluiten'}]).forEach(a=>{const b=document.createElement('button');b.className='btn'+(a.pri?' pri':'')+(a.danger?' danger':'');b.textContent=a.t;
    b.onclick=async()=>{if(a.fn){const keep=await a.fn(b);if(keep===false)return}$('modal').classList.remove('on')};$('mActs').appendChild(b)});
  $('modal').classList.add('on');const f=$('mBody').querySelector('input');if(f)setTimeout(()=>f.focus(),50)}
function confirmBox(title,text,okTxt,fn,danger){modal(title,'<p>'+text+'</p>',[{t:'Annuleren'},{t:okTxt,pri:!danger,danger:!!danger,fn}])}

function fieldHtml(k){

  const id='f_'+k,dis=canEdit?'':' disabled';let c='';
  if(f.b)c='<label class="sw"><input type="checkbox" id="'+id+'"'+dis+'><span></span></label>';
  else if(f.sel)c='<select id="'+id+'"'+dis+'>'+f.sel.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select>';
  else if(f.pw)c='<div class="pwrap"><input type="password" id="'+id+'" autocomplete="new-password" placeholder="(ongewijzigd)"'+dis+'><button type="button" data-eye="'+id+'">👁</button></div>';
  else if(f.n)c='<input type="number" id="'+id+'"'+(f.step?' step="'+f.step+'"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+dis+'>'+(f.u?'<span class="unit">'+f.u+'</span>':'');
  else c='<input type="text" id="'+id+'"'+dis+'>';
  return '<div class="f'+(f.wide?' wide':'')+(f.b?' bool':'')+'" data-k="'+k+'"><div><div class="lbl">'+esc(f.l)+'</div>'+(f.h?'<div class="help">'+esc(f.h)+'</div>':'')+'</div><div class="ctl">'+c+'</div></div>';
}
function fieldsCard(title,desc,keys,extra){return '<div class="card"><h2>'+title+'</h2>'+(desc?'<p class="desc">'+desc+'</p>':'')+keys.map(fieldHtml).join('')+(extra||'')+'</div>'}
function readField(k){const f=F[k],el=$('f_'+k);if(!el)return undefined;
  if(f.b)return el.checked;if(f.pw)return el.value;if(f.n){const v=parseFloat(el.value);return isNaN(v)?null:(f.int?Math.round(v):v)}
  if(f.sel){const v=el.value;return typeof cur[k]==='number'?Number(v):v}return el.value}
function fillFields(){Object.keys(F).forEach(k=>{const el=$('f_'+k);if(!el)return;const v=cur[k];
  if(F[k].b)el.checked=!!v;else if(F[k].pw)el.value='';else el.value=v==null?'':v})}
function onFieldChange(e){const row=e.target.closest('.f');if(!row)return;const k=row.dataset.k;if(!F[k])return;
  const v=readField(k);const d=F[k].pw?v!=='':v!==cur[k];if(d)dirty[k]=v;else delete dirty[k];row.classList.toggle('dirty',d);updateSavebar()}
function updateSavebar(){const n=Object.keys(dirty).length;$('savebar').classList.toggle('on',n>0);$('saveTxt').textContent=n+' '+(n===1?'wijziging':'wijzigingen')+' niet opgeslagen'}
$('saveCancel').onclick=()=>{dirty={};fillFields();document.querySelectorAll('.f.dirty').forEach(r=>r.classList.remove('dirty'));updateSavebar()};
$('saveBtn').onclick=()=>act($('saveBtn'),async()=>{const body={};Object.keys(dirty).forEach(k=>{if(dirty[k]!==null&&dirty[k]!=='')body[k]=dirty[k];else if(!F[k].pw)body[k]=dirty[k]});
  await api('/api/settings',{json:body});if(body.admin_token){token=body.admin_token;try{sessionStorage.setItem('lt_admin',token)}catch(e){}}
  dirty={};await loadSettings();updateSavebar()},'Instellingen opgeslagen');
document.addEventListener('input',onFieldChange);document.addEventListener('change',onFieldChange);

async function loadSettings(){const r=await fetch('/api/settings',{headers:hdr()});const d=await r.json();cur=d.settings||{};defs=d.defaults||{};canEdit=!!d.canEdit;

/* generieke terminal: base = /api/cloud/console of /api/system/console */
async function termSession(o){
  await loadScript('/vendor/xterm.js');await loadScript('/vendor/addon-fit.js');
  o.el.classList.remove('hide');o.el.innerHTML='';
  const term=new Terminal({cursorBlink:true,fontFamily:'Consolas,"DejaVu Sans Mono",monospace',fontSize:14,theme:{background:'#04090f',foreground:'#e8f1f8',cursor:'#38bdf8'}});
  const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(o.el);fit.fit();
  let d;try{d=await api(o.base+'/open',{json:Object.assign({cols:term.cols,rows:term.rows},o.body||{})})}catch(e){term.dispose();o.el.classList.add('hide');toast(e.message,'err');return null}
  const c={id:d.id,term,fit,pos:0,alive:true,q:'',busy:false,base:o.base,el:o.el};
  if(o.onOpen)o.onOpen(c);
  const flush=async()=>{if(c.busy||!c.q||!c.alive)return;c.busy=true;const data=c.q;c.q='';
    try{await api(c.base+'/'+c.id+'/write',{json:{data:b64enc(data)}})}catch(e){toast(e.message,'err')}c.busy=false;if(c.q)flush()};
  term.onData(x=>{c.q+=x;flush()});
  const ro=new ResizeObserver(()=>{try{fit.fit()}catch(e){}});ro.observe(o.el);c.ro=ro;
  term.onResize(sz=>{if(c.alive)api(c.base+'/'+c.id+'/resize',{json:{cols:sz.cols,rows:sz.rows}}).catch(()=>{})});
  term.focus();
  (async()=>{while(c.alive){
    try{const r=await api(c.base+'/'+c.id+'/read?pos='+c.pos+'&wait=20');
      if(r.data)term.write(b64bytes(r.data));c.pos=r.pos;
      if(r.closed){term.write('\r\n[console gesloten]\r\n');break}}
    catch(e){if(!c.alive)break;term.write('\r\n['+e.message+']\r\n');await new Promise(z=>setTimeout(z,2000));if(/bestaat niet/.test(e.message))break}
  }c.alive=false;if(c.ro)c.ro.disconnect();if(o.onEnd)o.onEnd(c)})();
  return c;
}

    catch(x){toast(x.message,'err');return false}}}])}
async function browseShare(name,sub){const b=$('shBrowse');b.classList.remove('hide');$('shBTitle').textContent='Bestanden – '+name;$('shFiles').textContent='Laden…';
  let d;try{d=await api('/api/system/shares/files?name='+encodeURIComponent(name)+'&sub='+encodeURIComponent(sub||''))}catch(e){$('shFiles').textContent=e.message;return}
  const up=d.path?d.path.split('/').slice(0,-1).join('/'):null,cur=SETTINGS_DB();
  $('shFiles').innerHTML='<div class="muted" style="margin-bottom:8px">'+esc(d.mountpoint+(d.path?'/'+d.path:''))+'</div><table class="list">'+
   (d.path?'<tr><td colspan="3"><a href="#" data-dir="'+esc(up)+'">⬆ terug</a></td></tr>':'')+
   d.dirs.map(x=>'<tr><td colspan="3"><a href="#" data-dir="'+esc((d.path?d.path+'/':'')+x)+'">📁 '+esc(x)+'</a></td></tr>').join('')+
   d.files.map(f=>{const full=d.mountpoint+'/'+(d.path?d.path+'/':'')+f.name;return '<tr><td>'+(f.db?'🗃 <b>':'')+esc(f.name)+(f.db?'</b>':'')+(full===cur?' <span class="pill"><span class="dot ok"></span>in gebruik</span>':'')+'</td><td class="muted">'+fmtBytes(f.size)+' · '+new Date(f.mtime*1000).toLocaleString('nl-BE')+'</td><td style="text-align:right">'+
     (f.db?'<button class="btn sm pri" data-use="'+esc(full)+'">Gebruiken</button>':'')+'</td></tr>'}).join('')+'</table>';
  $('shFiles').onclick=e=>{const a=e.target.closest('[data-dir]');if(a){e.preventDefault();browseShare(name,a.dataset.dir);return}
    const u=e.target.closest('[data-use]');if(u)modal('SwimTime-database kiezen','<p>'+esc(u.dataset.use)+'</p><p class="desc">Hoe lezen?</p>',[{t:'Annuleren'},
      {t:'Via een kopie',fn:()=>useDb(u.dataset.use,'kopie')},{t:'Rechtstreeks (alleen-lezen)',pri:1,fn:()=>useDb(u.dataset.use,'rechtstreeks')}])}}
function SETTINGS_DB(){return cur&&cur.db_source_path}
async function useDb(path,mode){try{await api('/api/settings',{json:{db_source_path:path,db_access_mode:mode}});await loadSettings();
  const r=await api('/api/db/sync',{json:{path}});toast(r.ok?'Database ingelezen: '+(r.heats||0)+' reeksen':'Ingesteld, maar inlezen mislukt: '+(r.error||''),r.ok?'ok':'err')}catch(e){toast(e.message,'err')}}
function wireShares(){if(!$('shList'))return;
  $('shAdd').onclick=()=>shareForm();$('shReload').onclick=()=>loadShares();
  $('shList').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const n=b.dataset.n,sh=shares.find(x=>x.name===n);
    if(b.dataset.a==='mount')act(b,async()=>{shares=(await api('/api/system/shares/mount',{json:{name:n}})).shares;drawShares()},'Gekoppeld (alleen-lezen)').then(()=>loadShares());
    else if(b.dataset.a==='umount')act(b,async()=>{shares=(await api('/api/system/shares/unmount',{json:{name:n}})).shares;drawShares();$('shBrowse').classList.add('hide')},'Losgekoppeld');
    else if(b.dataset.a==='browse')browseShare(n,'');
    else if(b.dataset.a==='edit')shareForm(sh);
    else if(b.dataset.a==='del')confirmBox('Share verwijderen','"'+esc(n)+'" wordt losgekoppeld en vergeten.','Verwijderen',()=>act(null,async()=>{shares=(await api('/api/system/shares/save',{json:{shares:shares.filter(x=>x.name!==n).map(x=>({name:x.name,path:x.path,user:x.user,domain:x.domain,vers:x.vers,auto:x.auto}))}})).shares;drawShares()},'Verwijderd'),true)}}

/* ---------------------------------------------------------------- kastjes (cloudserver) */
async function loadBoxes(){const el=$('kjBoxes');if(!el)return;let d;try{d=await api('/api/kastjes')}catch(e){el.textContent=e.message;return}
  const rel=d.release&&d.release.version;const b=d.boxes||[];if(!b.length){el.innerHTML='Nog geen kastjes verbonden. Zet op het kastje <b>Doorsturen › Beheer op afstand toestaan</b> aan.';return}
  el.innerHTML='<table class="list"><tr><th>Kastje</th><th>Status</th><th>Versie</th><th>Rol</th><th></th></tr>'+b.map(x=>'<tr><td><b>'+esc(x.label||x.name)+'</b>'+(x.label?'<div class="muted" style="font-size:12px">'+esc(x.name)+'</div>':'')+'</td>'+
    '<td>'+(x.online?'<span class="pill"><span class="dot ok"></span>verbonden</span>':'<span class="pill"><span class="dot"></span>'+fmtDur(x.lastSeen)+' geleden</span>')+(x.connected?' <span class="muted">· live gegevens'+(x.simulated?' (simulatie)':'')+'</span>':'')+'</td>'+
    '<td>'+esc(x.version||'?')+(rel&&x.version&&x.version!==rel?' <span style="color:var(--warn)" title="Updates › Van de publieke server">→ '+esc(rel)+'</span>':'')+'</td><td class="muted">'+esc({server:'server',display:'scherm',off:'uit'}[x.role]||x.role||'')+'</td>'+
    '<td style="text-align:right">'+(x.online?'<a class="btn sm pri" href="/kastje/'+encodeURIComponent(x.name)+'/settings" target="_blank">Beheer openen ↗</a>':'')+'</td></tr>').join('')+'</table>'}

async function loadUdp(){const el=$('udpStat');if(!el)return;try{const d=await (await fetch('/api/udp',{headers:hdr()})).json();
  const sn=(d.seen||[]);
  el.innerHTML=(sn.length?'<div style="margin-bottom:8px"><b>Automatisch gevonden:</b></div><table class="list"><tr><th>Verbinding</th><th>SwimTime-pc</th><th>Pakketten</th><th>Laatst</th><th></th></tr>'+sn.map(x=>'<tr><td><b>'+esc(x.iface||'?')+'</b></td><td>'+esc(x.from)+'</td><td>'+x.count+'</td><td class="muted">'+fmtDur(x.ago)+' geleden</td><td style="text-align:right;white-space:nowrap">'+
      (x.iface?'<button class="btn sm" data-udpif="'+esc(x.iface)+'">Enkel deze verbinding</button> ':'')+'<button class="btn sm" data-udpfrom="'+esc(x.from)+'">Enkel deze pc</button></td></tr>').join('')+'</table><div style="margin-top:8px"></div>':'')+
    (d.lastFrom?'Laatste pakket van <b>'+esc(d.lastFrom)+'</b>, '+fmtDur(d.lastAgo)+' geleden':'Nog geen pakketten ontvangen')+(d.interface?' · enkel op '+esc(d.interface):'')+
    (d.rejected?' · <span style="color:var(--warn)">'+d.rejected+' geweigerd'+(d.lastRejected?' (laatst van '+esc(d.lastRejected)+')':'')+'</span>':'')+(d.error?' · <span style="color:var(--bad)">'+esc(d.error)+'</span>':'')}catch(e){}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-udpif],[data-udpfrom]');if(!b)return;
  const body=b.dataset.udpif?{udp_interface:b.dataset.udpif}:{udp_allow_from:b.dataset.udpfrom};
  act(b,async()=>{await api('/api/settings',{json:body});await loadSettings();loadUdp()},b.dataset.udpif?'Enkel nog via '+b.dataset.udpif:'Enkel nog van '+b.dataset.udpfrom)});

async function loadPeers(){const el=$('sPeers');if(!el)return;let d;try{d=await (await fetch('/api/peers')).json()}catch(e){return}
  const P=(d.peers||[]);el.innerHTML=P.length?P.map(p=>'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0"><span class="pill"><span class="dot '+(p.live?'ok':'')+'"></span><b>'+esc(p.label||p.name)+'</b> · '+esc(p.ip)+' · '+esc({server:'server',display:'scherm',off:'uit'}[p.role]||p.role)+(p.live?' · live':'')+'</span>'+
    (p.role==='server'?'<button class="btn sm" type="button" data-peer-src="'+esc(p.url)+'">Als bron</button><button class="btn sm" type="button" data-peer-bk="'+esc(p.url)+'">Als reserve</button>':'')+'</div>').join('')+'<div class="muted" style="font-size:12.5px">Kastjes en laptops met de live timing kondigen zich elke 5 s aan op het lokale netwerk.</div>':'Nog niets gevonden op dit netwerk.'}
document.addEventListener('click',e=>{const a=e.target.closest('[data-peer-src],[data-peer-bk]');if(!a)return;const page=($('sPage')&&$('sPage').value)||'/callroom';
  if(a.dataset.peerSrc){$('sSrc').value='custom';$('sCustom').value=a.dataset.peerSrc+page;$('sSrc').dispatchEvent(new Event('change',{bubbles:true}))}else $('sBackup').value=a.dataset.peerBk+page;
  toast('Ingevuld – klik Toepassen')});

/* ---------------------------------------------------------------- infoscherm */
let imCur={mode:'off'},imSel='geen',imT=null;
let imSchedule=[];
function imDrawSched(){const el=$('imSched');if(!el)return;
  el.innerHTML=imSchedule.length?'<table class="list"><tr><th>Wedstrijd</th><th>Datum</th><th>Start</th><th>Plaats</th><th></th></tr>'+imSchedule.map((m,i)=>'<tr>'+
    '<td><input type="text" data-i="'+i+'" data-k="name" value="'+esc(m.name||'')+'" placeholder="naam" style="width:100%"></td>'+
    '<td><input type="date" data-i="'+i+'" data-k="date" value="'+esc(m.date||'')+'"></td>'+
    '<td><input type="time" data-i="'+i+'" data-k="start" value="'+esc(m.start||'')+'"></td>'+
    '<td><input type="text" data-i="'+i+'" data-k="place" value="'+esc(m.place||'')+'" placeholder="zwembad" style="width:100%"></td>'+
    '<td><button class="btn sm danger" type="button" data-del="'+i+'">✕</button></td></tr>').join('')+'</table>':'<p class="muted">Nog geen wedstrijden in de agenda.</p>'}
function imBody(mode){return {mode:mode,meet:$('imMeet').value,date:$('imDate').value,place:$('imPlace').value,until:$('imDur').value?'':$('imUntil').value,
  duration:parseFloat($('imDur').value)||0,schedule:imSchedule.filter(m=>m.date),daysBefore:parseInt($('imDays').value,10)||0,title:$('imTitle').value,
  kicker:$('imKicker').value,footer:$('imFoot').value,text:$('imText').value,ticker:$('imTicker').value,autoHide:$('imAuto').checked,allowClose:$('imClose').checked,
  pages:{publiek:$('imPub').checked,callroom:$('imCr').checked}}}
function imPreview(){clearTimeout(imT);imT=setTimeout(()=>{const f=$('imFrame');if(!f)return;const b=imBody(imSel==='off'?'geen':imSel);b.updatedAt=1;
  if(b.duration){b.untilAt=Math.round(Date.now()/1000+b.duration*60);delete b.until}
  f.src='/info?preview='+encodeURIComponent(JSON.stringify(b));imScale()},350)}
function imScale(){const pv=$('imPv'),f=$('imFrame');if(pv&&f)f.style.transform='scale('+(pv.clientWidth/1600)+')'}
function imMarks(){document.querySelectorAll('#imModes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===imSel))}
function imStatus(cloud){const M={off:'uit (gewone live uitslagen)',auto:'automatisch volgens de agenda',geen:'geen wedstrijd',volgende:'volgende wedstrijd',welkom:'welkom',inzwemmen:'inzwemmen',pauze:'pauze',prijsuitreiking:'prijsuitreiking',einde:'einde',bericht:'eigen bericht'};
  $('imStat').innerHTML='Nu actief: <b>'+esc(M[imCur.mode]||imCur.mode)+'</b>'+(imCur.updatedAt?' <span class="muted">· ingesteld '+new Date(imCur.updatedAt*1000).toLocaleString('nl-BE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(imCur.source?' via '+(imCur.source==='cloud'?'de cloudserver':'een lokale server'):'')+'</span>':'')+(cloud?(' · publieke server '+(cloud.ok?'<span style="color:var(--ok)">✓ bijgewerkt</span>':'<span style="color:var(--bad)">✗ '+esc(cloud.error||'')+'</span>')):'')}
async function loadInfo(){try{imCur=await (await fetch('/api/info')).json()}catch(e){imCur={mode:'off'}}
  const i=imCur;imSel=i.mode&&i.mode!=='off'?i.mode:imSel;
  [['imMeet','meet'],['imDate','date'],['imPlace','place'],['imUntil','until'],['imTitle','title'],['imKicker','kicker'],['imFoot','footer'],['imText','text'],['imTicker','ticker']].forEach(([id,k])=>{if(i[k]!=null)$(id).value=i[k]});
  imSchedule=(i.schedule||[]).map(m=>Object.assign({},m));imDrawSched();$('imDays').value=i.daysBefore!=null?i.daysBefore:7;$('imDur').value=i.duration||'';
  $('imAuto').checked=i.autoHide!==false;$('imClose').checked=i.allowClose!==false;$('imPub').checked=!(i.pages&&i.pages.publiek===false);$('imCr').checked=!(i.pages&&i.pages.callroom===false);
  imMarks();imStatus();imPreview()}
function wireInfo(){if(!$('imModes'))return;
  $('imModes').onclick=e=>{const b=e.target.closest('button[data-mode]');if(!b)return;if(b.dataset.mode==='off'){$('imOff').click();return}imSel=b.dataset.mode;imMarks();imPreview()};
  $('pg_info').addEventListener('input',imPreview);$('pg_info').addEventListener('change',imPreview);
  $('imAdd').onclick=()=>{const d=new Date(Date.now()+14*864e5);imSchedule.push({name:'',date:d.toISOString().slice(0,10),start:'13:00',place:''});imDrawSched();imPreview()};
  $('imSched').addEventListener('input',e=>{const t=e.target;if(t.dataset.i!=null){imSchedule[+t.dataset.i][t.dataset.k]=t.value}});
  $('imSched').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){imSchedule.splice(+b.dataset.del,1);imDrawSched();imPreview()}});
  const send=async(mode,btn)=>act(btn,async()=>{if(relayMode&&!relayAdmin)throw new Error('meld je aan met het beheerwachtwoord van de cloudserver');
    const r=await api('/api/info',{json:imBody(mode)});imCur=r.info;imStatus(r.cloud);imMarks()},mode==='off'?'Infoscherm uit':'Infoscherm getoond');
  $('imShow').onclick=e=>send(imSel,e.target);$('imOff').onclick=e=>send('off',e.target);
  window.addEventListener('resize',imScale)}

/* ---------------------------------------------------------------- opstart */
async function boot(){
  try{await loadSettings()}catch(e){toast('Instellingen niet geladen: '+e.message,'err')}
  sys=null;try{const r=await fetch('/api/system/status',{headers:hdr()});const d=await r.json();if(r.ok&&d.hostname)sys=d;else sysLocked=!!d.locked}catch(e){}
  buildNav();pages();fillFields();wireData();
  if(sys){wireRole();fillRole();wireNet();renderNet(true);wirePortal();wireUsers();wireUpdates();renderSys()}
  wireSystem();wireSim();wireCloud();wireShares();wireLocalConsole();wireInfo();if($('kjRefresh'))$('kjRefresh').onclick=()=>loadCloudStats();if($('kjBoxRefresh'))$('kjBoxRefresh').onclick=()=>loadBoxes();loadData();showTab();refreshStatus();
}
setInterval(()=>{if(!document.hidden){refreshStatus();loadSim()}},5000);
setInterval(()=>{if(!document.hidden&&$('dbStat'))loadData()},15000);
window.addEventListener('beforeunload',e=>{if(Object.keys(dirty).length){e.preventDefault();e.returnValue=''}});
boot();
})();
</script>
</body>
</html>
